<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1F3864"/></marker>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#C08A2E"/></marker>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2E5496"/></marker>
  </defs>
  <!-- Band A: batch pipeline -->
  <rect x="0" y="0" width="760" height="150" fill="#F1F4F9"/>
  <text x="10" y="16" font-size="9.5" font-weight="700" fill="#1F3864">A · BATCH DATA PIPELINE — Python, runs on the Mac (ETL) or GitHub Actions (letters); monthly / on demand</text>
  <g font-size="8.5">
    <rect x="15" y="40" width="110" height="50" rx="3" fill="#fff" stroke="#6B7686"/>
    <text x="70" y="57" text-anchor="middle" font-weight="700" fill="#6B7686">1 · TCAD roll export</text>
    <text x="70" y="70" text-anchor="middle">PACS 8.0.33 fixed-width</text>
    <text x="70" y="82" text-anchor="middle">493,324 accounts · ~17 GB</text>

    <rect x="150" y="40" width="120" height="50" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="210" y="57" text-anchor="middle" font-weight="700" fill="#1F3864">2 · ETL loader</text>
    <text x="210" y="70" text-anchor="middle">cleanbill/etl/load.py</text>
    <text x="210" y="82" text-anchor="middle">→ data/tcad.duckdb</text>

    <rect x="295" y="40" width="130" height="50" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="360" y="57" text-anchor="middle" font-weight="700" fill="#1F3864">3 · Lead engine + 4 · Estimator</text>
    <text x="360" y="70" text-anchor="middle">cleanbill/etl/leads.py · cleanbill/estimator/</text>
    <text x="360" y="82" text-anchor="middle">→ data/out/leads.csv (22,889)</text>

    <rect x="450" y="40" width="100" height="50" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="500" y="57" text-anchor="middle" font-weight="700" fill="#1F3864">5 · Publisher</text>
    <text x="500" y="70" text-anchor="middle">cleanbill/etl/publish.py</text>
    <text x="500" y="82" text-anchor="middle">→ properties + leads</text>

    <rect x="295" y="102" width="130" height="36" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="360" y="117" text-anchor="middle" font-weight="700" fill="#1F3864">6 · Letter generator</text>
    <text x="360" y="129" text-anchor="middle">cleanbill/letters/ → PDF + QR + §41.0051</text>

    <rect x="450" y="102" width="100" height="36" rx="3" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/>
    <text x="500" y="117" text-anchor="middle" font-weight="700" fill="#C08A2E">Lob (not built)</text>
    <text x="500" y="129" text-anchor="middle">print &amp; mail API</text>

    <rect x="580" y="40" width="165" height="98" rx="3" fill="#fff" stroke="#6B7686"/>
    <text x="662" y="57" text-anchor="middle" font-weight="700" fill="#6B7686">Where batch code runs</text>
    <text x="662" y="72" text-anchor="middle">Mac: ETL (export too big for a</text>
    <text x="662" y="84" text-anchor="middle">hosted runner), leads, publish,</text>
    <text x="662" y="96" text-anchor="middle">letter batches, new_claim</text>
    <text x="662" y="112" text-anchor="middle">GitHub Actions: etl.yml (manual),</text>
    <text x="662" y="124" text-anchor="middle">agent.yml (every 30 min)</text>
  </g>
  <line x1="125" y1="65" x2="150" y2="65" stroke="#1F3864" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="270" y1="65" x2="295" y2="65" stroke="#1F3864" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="425" y1="65" x2="450" y2="65" stroke="#1F3864" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="360" y1="90" x2="360" y2="102" stroke="#1F3864" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="425" y1="120" x2="450" y2="120" stroke="#C08A2E" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- Band B/C label -->
  <text x="10" y="166" font-size="9.5" font-weight="700" fill="#1F3864">B · CUSTOMER PATH (real time)  ·  C · OPERATIONS (Charlie + agent)</text>

  <!-- Supabase container -->
  <rect x="300" y="172" width="340" height="238" rx="4" fill="#fff" stroke="#1F3864" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="310" y="186" font-size="8.5" font-weight="700" fill="#1F3864">SUPABASE · project cleanbill (us-east-1, free tier)</text>

  <g font-size="8.5">
    <!-- functions column -->
    <rect x="310" y="195" width="150" height="34" rx="3" fill="#F1F4F9" stroke="#1F3864"/>
    <text x="385" y="209" text-anchor="middle" font-weight="700" fill="#1F3864">8 · claim (edge function)</text>
    <text x="385" y="221" text-anchor="middle">GET lead · POST claim + upload</text>

    <rect x="310" y="235" width="150" height="34" rx="3" fill="#F1F4F9" stroke="#1F3864"/>
    <text x="385" y="249" text-anchor="middle" font-weight="700" fill="#1F3864">9 · process-claim</text>
    <text x="385" y="261" text-anchor="middle">extract → validate → 50-114 → draft</text>

    <rect x="310" y="275" width="150" height="34" rx="3" fill="#F1F4F9" stroke="#1F3864"/>
    <text x="385" y="289" text-anchor="middle" font-weight="700" fill="#1F3864">10 · ops (edge function)</text>
    <text x="385" y="301" text-anchor="middle">KPIs · claims · approve/discard</text>

    <rect x="310" y="315" width="150" height="34" rx="3" fill="#F1F4F9" stroke="#1F3864"/>
    <text x="385" y="329" text-anchor="middle" font-weight="700" fill="#1F3864">11 · selftest</text>
    <text x="385" y="341" text-anchor="middle">synthetic claim through the real path</text>

    <!-- DB -->
    <rect x="480" y="250" width="150" height="150" rx="3" fill="#F1F4F9" stroke="#1F3864"/>
    <text x="555" y="264" text-anchor="middle" font-weight="700" fill="#1F3864">Postgres + Storage</text>
    <text x="555" y="278" text-anchor="middle">properties · leads · customers</text>
    <text x="555" y="290" text-anchor="middle">documents · filings · refunds</text>
    <text x="555" y="302" text-anchor="middle">messages · events · audit_log</text>
    <text x="555" y="314" text-anchor="middle">app_settings</text>
    <text x="555" y="330" text-anchor="middle" font-weight="700" fill="#1F3864">Buckets (private)</text>
    <text x="555" y="342" text-anchor="middle">ids/ (license images, purged)</text>
    <text x="555" y="354" text-anchor="middle">packets/ (filled 50-114 PDFs)</text>
    <text x="555" y="372" text-anchor="middle" fill="#6B7686">RLS on, no anon policies —</text>
    <text x="555" y="384" text-anchor="middle" fill="#6B7686">service-role key only</text>
  </g>
  <!-- functions -> DB -->
  <line x1="460" y1="272" x2="480" y2="300" stroke="#1F3864" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="472" y="266" font-size="7.5" fill="#1F3864" text-anchor="end">all four</text>
  <!-- claim kicks process-claim -->
  <path d="M395,229 L395,235" stroke="#2E5496" stroke-width="1.6" marker-end="url(#a3)"/>
  <text x="400" y="234" font-size="7.5" fill="#2E5496">kick (async)</text>

  <!-- Anthropic -->
  <g font-size="8.5">
    <rect x="655" y="185" width="95" height="56" rx="3" fill="#fff" stroke="#6B7686"/>
    <text x="702" y="201" text-anchor="middle" font-weight="700" fill="#6B7686">Anthropic API</text>
    <text x="702" y="214" text-anchor="middle">Haiku 4.5 — read ID</text>
    <text x="702" y="226" text-anchor="middle">Sonnet 5 — agent</text>
    <text x="702" y="238" text-anchor="middle" fill="#6B7686">≈ $0.004 / ID</text>
  </g>
  <!-- process-claim -> Anthropic (above DB) -->
  <path d="M460,242 L640,242 L655,213" fill="none" stroke="#6B7686" stroke-width="1.2" marker-end="url(#a1)"/>
  <!-- publisher -> DB with hop -->
  <path d="M550,72 L612,72 L612,250" fill="none" stroke="#1F3864" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="616" y="160" font-size="7.5" fill="#1F3864">16,775</text><text x="616" y="169" font-size="7.5" fill="#1F3864">leads</text>

  <!-- Left side: homeowner + pages -->
  <g font-size="8.5">
    <rect x="15" y="195" width="80" height="34" rx="3" fill="#fff" stroke="#6B7686"/>
    <text x="55" y="209" text-anchor="middle" font-weight="700" fill="#6B7686">Homeowner</text>
    <text x="55" y="221" text-anchor="middle">phone, scans QR</text>
    <rect x="115" y="195" width="165" height="34" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="197" y="209" text-anchor="middle" font-weight="700" fill="#1F3864">7 · Static pages (GitHub Pages)</text>
    <text x="197" y="221" text-anchor="middle">index · claim · agreement (docs/)</text>

    <rect x="15" y="275" width="80" height="34" rx="3" fill="#fff" stroke="#6B7686"/>
    <text x="55" y="289" text-anchor="middle" font-weight="700" fill="#6B7686">Charlie</text>
    <text x="55" y="301" text-anchor="middle">operator</text>
    <rect x="115" y="275" width="165" height="34" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="197" y="289" text-anchor="middle" font-weight="700" fill="#1F3864">7 · ops.html (GitHub Pages)</text>
    <text x="197" y="301" text-anchor="middle">password → x-ops-key header</text>

    <rect x="15" y="345" width="265" height="65" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="147" y="360" text-anchor="middle" font-weight="700" fill="#1F3864">GITHUB ACTIONS (batch runtime, Python)</text>
    <text x="147" y="374" text-anchor="middle">12 · Claims agent — Sonnet 5 tool loop, 7 tools, every 30 min</text>
    <text x="147" y="386" text-anchor="middle">13 · ID purge job (after each agent cycle)</text>
    <text x="147" y="398" text-anchor="middle">shadow mode: drafts and routes; never sends, files or charges</text>
  </g>
  <line x1="95" y1="212" x2="115" y2="212" stroke="#6B7686" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="280" y1="212" x2="310" y2="212" stroke="#1F3864" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="295" y="206" font-size="7" fill="#1F3864" text-anchor="middle">JSON</text>
  <line x1="95" y1="292" x2="115" y2="292" stroke="#6B7686" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="280" y1="292" x2="310" y2="292" stroke="#1F3864" stroke-width="1.4" marker-end="url(#a1)"/>
  <!-- letter -> homeowner -->
  <path d="M500,138 L500,150 L55,150 L55,195" fill="none" stroke="#C08A2E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a2)"/>
  <text x="60" y="176" font-size="7.5" fill="#C08A2E">letter with claim code CB-XXXX-XXXX</text>
  <!-- agent -> DB -->
  <path d="M280,378 L480,378" fill="none" stroke="#1F3864" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="380" y="373" font-size="7.5" fill="#1F3864" text-anchor="middle">service-role key (read/write)</text>
  <!-- agent -> Anthropic -->
  <path d="M147,410 L147,440 L702,440 L702,241" fill="none" stroke="#6B7686" stroke-width="1.2" marker-end="url(#a1)"/>
  <text x="430" y="452" font-size="7.5" fill="#6B7686" text-anchor="middle">agent calls Sonnet 5 (prompt-cached system prompt)</text>
  <!-- legend -->
  <text x="10" y="472" font-size="8" fill="#6B7686">Solid navy = built and live · dashed amber = not built · grey = external system · numbers = module IDs used in Table 3.1</text>
</svg>
