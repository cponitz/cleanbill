<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-size="8.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="v1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1F3864"/></marker></defs>
  <!-- inputs -->
  <rect x="10" y="20" width="150" height="70" rx="3" fill="#F1F4F9" stroke="#1F3864"/>
  <text x="85" y="36" text-anchor="middle" font-weight="700" fill="#1F3864">Inputs</text>
  <text x="18" y="50">extracted (13 fields + confidence)</text>
  <text x="18" y="62">property (owner_name, situs_*)</text>
  <text x="18" y="74">typed signature name</text>
  <text x="18" y="86">today</text>
  <!-- checks -->
  <g>
    <rect x="190" y="12" width="230" height="22" rx="3" fill="#fff" stroke="#1F3864"/><text x="196" y="27">1 readable? (model says image is legible)</text>
    <rect x="190" y="40" width="230" height="22" rx="3" fill="#fff" stroke="#1F3864"/><text x="196" y="55">2 texas_id: issuing_state = TX and type ≠ other</text>
    <rect x="190" y="68" width="230" height="22" rx="3" fill="#fff" stroke="#1F3864"/><text x="196" y="83">3 name_match: ID first+last ⊂ owner_name tokens</text>
    <rect x="190" y="96" width="230" height="22" rx="3" fill="#fff" stroke="#1F3864"/><text x="196" y="111">4 signer_ok: ID first+last ⊂ typed signature</text>
    <rect x="190" y="124" width="230" height="22" rx="3" fill="#fff" stroke="#1F3864"/><text x="196" y="139">5 low_conf: min(name, address, dob) &lt; 0.6</text>
    <rect x="190" y="152" width="230" height="22" rx="3" fill="#fff" stroke="#1F3864"/><text x="196" y="167">6 age from DOB: &lt; 18 blocks; ≥ 65 flags OV65</text>
    <rect x="190" y="180" width="230" height="22" rx="3" fill="#fff" stroke="#2E5496" stroke-width="1.4"/><text x="196" y="195" fill="#2E5496">7 address_match: number, first street token, zip5, unit</text>
    <rect x="190" y="208" width="230" height="22" rx="3" fill="#fff" stroke="#6B7686"/><text x="196" y="223" fill="#6B7686">8 expired: warn only (TCAD may accept)</text>
  </g>
  <line x1="160" y1="55" x2="190" y2="55" stroke="#1F3864" stroke-width="1.2" marker-end="url(#v1)"/>
  <!-- decision -->
  <path d="M470,60 L540,20 L610,60 L540,100 Z" fill="#F1F4F9" stroke="#1F3864"/>
  <text x="540" y="56" text-anchor="middle" font-weight="700" fill="#1F3864">any of 1–6</text>
  <text x="540" y="68" text-anchor="middle" fill="#1F3864">failing?</text>
  <path d="M470,190 L540,150 L610,190 L540,230 Z" fill="#F1F4F9" stroke="#1F3864"/>
  <text x="540" y="186" text-anchor="middle" font-weight="700" fill="#1F3864">address</text>
  <text x="540" y="198" text-anchor="middle" fill="#1F3864">matches?</text>
  <line x1="420" y1="110" x2="470" y2="62" stroke="#1F3864" stroke-width="1.2" marker-end="url(#v1)"/>
  <line x1="540" y1="100" x2="540" y2="150" stroke="#1F3864" stroke-width="1.2" marker-end="url(#v1)"/>
  <text x="548" y="128" fill="#1F3864">no</text>
  <!-- outcomes -->
  <rect x="640" y="46" width="110" height="28" rx="14" fill="#E3E8F0" stroke="#A23B3B"/><text x="695" y="64" text-anchor="middle" font-weight="700" fill="#A23B3B">needs_review</text>
  <line x1="610" y1="60" x2="640" y2="60" stroke="#1F3864" stroke-width="1.2" marker-end="url(#v1)"/><text x="620" y="54" fill="#1F3864">yes</text>
  <rect x="640" y="176" width="110" height="28" rx="14" fill="#E3E8F0" stroke="#2E7D4F"/><text x="695" y="194" text-anchor="middle" font-weight="700" fill="#2E7D4F">ready_to_submit</text>
  <line x1="610" y1="190" x2="640" y2="190" stroke="#1F3864" stroke-width="1.2" marker-end="url(#v1)"/><text x="620" y="184" fill="#1F3864">yes</text>
  <rect x="485" y="245" width="110" height="28" rx="14" fill="#E3E8F0" stroke="#C08A2E"/><text x="540" y="263" text-anchor="middle" font-weight="700" fill="#C08A2E">needs_dl_update</text>
  <line x1="540" y1="230" x2="540" y2="245" stroke="#1F3864" stroke-width="1.2" marker-end="url(#v1)"/><text x="548" y="241" fill="#1F3864">no</text>
  <!-- notes (full width, below) -->
  <rect x="10" y="284" width="740" height="44" fill="#F1F4F9" stroke="#C9D2DF"/>
  <text x="16" y="295" fill="#1F2733" font-size="8">Address normalisation: uppercase, strip punctuation, STREET→ST etc., APT/UNIT/STE/#→unit; a suffix or direction missing on the license still matches.</text>
  <text x="16" y="305" fill="#1F2733" font-size="8">Name match tolerates TCAD's "LAST FIRST M" order, joint owners with "&amp;", and 3-letter nickname prefixes (Rich/Richard). Blocking findings become claims.findings (structured, SPEC-06).</text>
  <text x="16" y="315" fill="#1F2733" font-size="8">Review beats DL-update when both fail. Same rules in TypeScript (validate.ts, 22 tests) and Python (cleanbill/agent/validate.py), generated from one shared fixture (G-9).</text>
</svg>
