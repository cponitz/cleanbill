<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-size="8.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="crow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,5 L9,1 M0,5 L9,9 M0,5 L9,5" stroke="#1F3864" fill="none" stroke-width="1"/></marker></defs>
  <!-- properties -->
  <g>
    <rect x="15" y="20" width="150" height="120" rx="3" fill="#fff" stroke="#1F3864"/>
    <rect x="15" y="20" width="150" height="18" rx="3" fill="#1F3864"/>
    <text x="90" y="33" text-anchor="middle" fill="#fff" font-weight="700">properties</text>
    <text x="22" y="52" font-weight="700">prop_id PK</text>
    <text x="22" y="64">owner_name, owner_addr*</text>
    <text x="22" y="76">situs_*, situs_full, legal_desc</text>
    <text x="22" y="88">state_cd, prop_type</text>
    <text x="22" y="100">market/appraised/assessed_value</text>
    <text x="22" y="112">deed_date, hs/ov65/dp/dv_exempt</text>
    <text x="22" y="124">address_suppressed</text>
    <text x="22" y="136" fill="#6B7686">fact from TCAD, one row per account</text>
  </g>
  <!-- property_entities + property_values (new) -->
  <g>
    <rect x="15" y="160" width="150" height="70" rx="3" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/>
    <rect x="15" y="160" width="150" height="18" rx="3" fill="#C08A2E"/>
    <text x="90" y="173" text-anchor="middle" fill="#fff" font-weight="700">property_entities · property_values</text>
    <text x="22" y="192" font-weight="700">prop_id FK · entity_cd · taxable_value</text>
    <text x="22" y="204" font-weight="700">prop_id FK · tax_year · appraised_value</text>
    <text x="22" y="216" fill="#6B7686">SPEC-01 (taxing units) · G-15/G-27</text>
    <text x="22" y="226" fill="#6B7686">(5-year value history)</text>
  </g>
  <!-- leads -->
  <g>
    <rect x="205" y="20" width="150" height="120" rx="3" fill="#fff" stroke="#1F3864"/>
    <rect x="205" y="20" width="150" height="18" rx="3" fill="#1F3864"/>
    <text x="280" y="33" text-anchor="middle" fill="#fff" font-weight="700">leads</text>
    <text x="212" y="52" font-weight="700">id PK · prop_id FK</text>
    <text x="212" y="64" font-weight="700">claim_code UNIQUE</text>
    <text x="212" y="76">tier, score, refund_years[]</text>
    <text x="212" y="88">est_refund_total / _by_year</text>
    <text x="212" y="100">est_forward_annual, unconfirmed</text>
    <text x="212" y="112" font-weight="700" fill="#2E5496">status lead_status</text>
    <text x="212" y="124">letter_variant, mailed_at, opened_at</text>
    <text x="212" y="136" fill="#6B7686">our belief a property is owed money</text>
  </g>
  <!-- customers (account) NEW -->
  <g>
    <rect x="395" y="20" width="160" height="100" rx="3" fill="#fff" stroke="#2E5496" stroke-width="1.6"/>
    <rect x="395" y="20" width="160" height="18" rx="3" fill="#2E5496"/>
    <text x="475" y="33" text-anchor="middle" fill="#fff" font-weight="700">customers (account) — v2</text>
    <text x="402" y="52" font-weight="700">id PK · email UNIQUE</text>
    <text x="402" y="64">full_name, phone</text>
    <text x="402" y="76">stripe_customer_id, card_on_file</text>
    <text x="402" y="88">created_from_claim_id, auth_user_id</text>
    <text x="402" y="100">created_at, updated_at</text>
    <text x="402" y="114" fill="#6B7686">the person; created implicitly at first claim</text>
  </g>
  <!-- claims (was customers) -->
  <g>
    <rect x="395" y="140" width="160" height="130" rx="3" fill="#fff" stroke="#1F3864"/>
    <rect x="395" y="140" width="160" height="18" rx="3" fill="#1F3864"/>
    <text x="475" y="153" text-anchor="middle" fill="#fff" font-weight="700">claims (was "customers")</text>
    <text x="402" y="172" font-weight="700">id PK · customer_id FK · lead_id FK</text>
    <text x="402" y="184">service_type ('homestead_refund')</text>
    <text x="402" y="196">occupied_since, owns_other_homestead</text>
    <text x="402" y="208">household, prev_homestead(+_address)</text>
    <text x="402" y="220">agreement_*, signature_name/ip/ua</text>
    <text x="402" y="232" font-weight="700" fill="#2E5496">status claim_status</text>
    <text x="402" y="244">findings jsonb (structured, replaces status_reason)</text>
    <text x="402" y="256" fill="#6B7686">one engagement: this person, this property,</text>
    <text x="402" y="266" fill="#6B7686">this service</text>
  </g>
  <!-- documents -->
  <g>
    <rect x="395" y="290" width="160" height="88" rx="3" fill="#fff" stroke="#1F3864"/>
    <rect x="395" y="290" width="160" height="18" rx="3" fill="#1F3864"/>
    <text x="475" y="303" text-anchor="middle" fill="#fff" font-weight="700">documents</text>
    <text x="402" y="322" font-weight="700">id PK · claim_id FK</text>
    <text x="402" y="334">kind (dl_front|dl_back|other|typed_id)</text>
    <text x="402" y="346">storage_path, mime, bytes</text>
    <text x="402" y="358">extracted jsonb, validation jsonb</text>
    <text x="402" y="370">extraction_model/_cost_usd, purged_at</text>
  </g>
  <!-- filings -->
  <g>
    <rect x="595" y="140" width="150" height="130" rx="3" fill="#fff" stroke="#1F3864"/>
    <rect x="595" y="140" width="150" height="18" rx="3" fill="#1F3864"/>
    <text x="670" y="153" text-anchor="middle" fill="#fff" font-weight="700">filings</text>
    <text x="602" y="172" font-weight="700">id PK · claim_id FK</text>
    <text x="602" y="184">form_version, tax_years[]</text>
    <text x="602" y="196">packet_path, packet_sha256</text>
    <text x="602" y="208">generated_at, submitted_at, channel</text>
    <text x="602" y="220">tcad_status, tcad_checked_at</text>
    <text x="602" y="232">approved_at, denied_at, denial_reason</text>
    <text x="602" y="244" fill="#6B7686">one packet sent to TCAD; a claim</text>
    <text x="602" y="254" fill="#6B7686">may have several (re-generated,</text>
    <text x="602" y="264" fill="#6B7686">denied-and-refiled)</text>
  </g>
  <!-- refunds -->
  <g>
    <rect x="595" y="290" width="150" height="88" rx="3" fill="#fff" stroke="#1F3864"/>
    <rect x="595" y="290" width="150" height="18" rx="3" fill="#1F3864"/>
    <text x="670" y="303" text-anchor="middle" fill="#fff" font-weight="700">refunds (design §5.7)</text>
    <text x="602" y="322" font-weight="700">id PK · filing_id FK</text>
    <text x="602" y="334">taxing_unit, tax_year, amount</text>
    <text x="602" y="346">observed_at, source, evidence_path</text>
    <text x="602" y="358">fee_amount, notice_sent_at, charged_at</text>
    <text x="602" y="370">stripe_payment_id, dispute_status</text>
  </g>
  <!-- messages -->
  <g>
    <rect x="205" y="290" width="160" height="88" rx="3" fill="#fff" stroke="#1F3864"/>
    <rect x="205" y="290" width="160" height="18" rx="3" fill="#1F3864"/>
    <text x="285" y="303" text-anchor="middle" fill="#fff" font-weight="700">messages</text>
    <text x="212" y="322" font-weight="700">id PK · claim_id FK</text>
    <text x="212" y="334">direction (inbound|outbound)</text>
    <text x="212" y="346">channel (email|sms|letter|portal|note)</text>
    <text x="212" y="358">subject, body, intent</text>
    <text x="212" y="370">agent_draft, approved_by/_at, sent_at</text>
  </g>
  <!-- monitoring (new) -->
  <g>
    <rect x="205" y="160" width="150" height="110" rx="3" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/>
    <rect x="205" y="160" width="150" height="18" rx="3" fill="#C08A2E"/>
    <text x="280" y="173" text-anchor="middle" fill="#fff" font-weight="700">record_checks (design §5.7)</text>
    <text x="212" y="192" font-weight="700">id PK · filing_id FK</text>
    <text x="212" y="204">source (tcad_portal|roll_supplement|</text>
    <text x="212" y="216">   tax_office|customer)</text>
    <text x="212" y="228">checked_at, observed jsonb</text>
    <text x="212" y="240">changed (bool), evidence_path</text>
    <text x="212" y="254" fill="#6B7686">every look at an official record,</text>
    <text x="212" y="264" fill="#6B7686">kept as evidence</text>
  </g>
  <!-- events/audit/settings -->
  <g>
    <rect x="15" y="290" width="160" height="88" rx="3" fill="#fff" stroke="#6B7686"/>
    <rect x="15" y="290" width="160" height="18" rx="3" fill="#6B7686"/>
    <text x="95" y="303" text-anchor="middle" fill="#fff" font-weight="700">events · audit_log · app_settings</text>
    <text x="22" y="322" font-weight="700">events: at, claim_code, kind, detail</text>
    <text x="22" y="334">view · view_miss · claim_submitted</text>
    <text x="22" y="348" font-weight="700">audit_log: actor, action, entity(_id), detail</text>
    <text x="22" y="360">claim-api · process-claim · ops · agent</text>
    <text x="22" y="374" font-weight="700">app_settings: key, value (secrets fallback)</text>
  </g>
  <!-- relationships -->
  <line x1="165" y1="80" x2="205" y2="80" stroke="#1F3864" stroke-width="1.2" marker-end="url(#crow)"/>
  <text x="185" y="74" text-anchor="middle" fill="#1F3864">1 : n</text>
  <line x1="90" y1="140" x2="90" y2="160" stroke="#1F3864" stroke-width="1.2" marker-end="url(#crow)"/>
  <text x="100" y="154" fill="#1F3864">1 : n</text>
  <line x1="355" y1="200" x2="395" y2="200" stroke="#1F3864" stroke-width="1.2"/>
  <text x="375" y="194" text-anchor="middle" fill="#1F3864">1 : 1</text>
  <path d="M280,140 L280,150 L375,150 L375,200" fill="none" stroke="#1F3864" stroke-width="1.2"/>
  <line x1="475" y1="120" x2="475" y2="140" stroke="#2E5496" stroke-width="1.4" marker-end="url(#crow)"/>
  <text x="482" y="134" fill="#2E5496" font-weight="700">1 : n</text>
  <line x1="555" y1="200" x2="595" y2="200" stroke="#1F3864" stroke-width="1.2" marker-end="url(#crow)"/>
  <text x="575" y="194" text-anchor="middle" fill="#1F3864">1 : n</text>
  <line x1="475" y1="270" x2="475" y2="290" stroke="#1F3864" stroke-width="1.2" marker-end="url(#crow)"/>
  <text x="482" y="284" fill="#1F3864">1 : n</text>
  <line x1="670" y1="270" x2="670" y2="290" stroke="#1F3864" stroke-width="1.2" marker-end="url(#crow)"/>
  <text x="677" y="284" fill="#1F3864">1 : n</text>
  <path d="M395,250 L285,250 L285,290" fill="none" stroke="#1F3864" stroke-width="1.2" marker-end="url(#crow)"/>
  <text x="292" y="284" fill="#1F3864">1 : n</text>
  <path d="M595,215 L570,215 L570,150 L365,150 L365,215 L355,215" fill="none" stroke="#C08A2E" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="380" y="146" fill="#C08A2E" font-size="7.5">filings 1 : n record_checks</text>
  <text x="10" y="400" fill="#6B7686">v2 changes (SPEC-04): the prototype's "customers" table becomes "claims" (one engagement per person × property × service); a new "customers" table is the person/account, created</text>
  <text x="10" y="412" fill="#6B7686">implicitly from the first signed claim and matched by email thereafter — so one customer can have many claims (a second home years later, or a future non-property service) and one claim many</text>
  <text x="10" y="424" fill="#6B7686">filings. Amber dashed = tables introduced by v2.1 designs, not yet migrated. Every table has RLS enabled with no policies: service-role key only.</text>
</svg>
