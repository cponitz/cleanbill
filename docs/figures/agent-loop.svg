<svg viewBox="0 0 760 262" xmlns="http://www.w3.org/2000/svg" font-size="8.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="g1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1F3864"/></marker></defs>
  <!-- loop -->
  <rect x="10" y="20" width="120" height="44" rx="3" fill="#F1F4F9" stroke="#1F3864"/>
  <text x="70" y="38" text-anchor="middle" font-weight="700" fill="#1F3864">Actions cron (30 min)</text>
  <text x="70" y="52" text-anchor="middle">pytest, then run.py</text>
  <rect x="160" y="20" width="130" height="44" rx="3" fill="#fff" stroke="#1F3864"/>
  <text x="225" y="38" text-anchor="middle" font-weight="700" fill="#1F3864">list_customers()</text>
  <text x="225" y="52" text-anchor="middle">submitted · needs_dl_update · needs_review</text>
  <rect x="320" y="20" width="130" height="44" rx="3" fill="#fff" stroke="#1F3864"/>
  <text x="385" y="38" text-anchor="middle" font-weight="700" fill="#1F3864">task_for_claim(id, status)</text>
  <text x="385" y="52" text-anchor="middle">one short instruction per claim</text>
  <line x1="130" y1="42" x2="160" y2="42" stroke="#1F3864" stroke-width="1.2" marker-end="url(#g1)"/>
  <line x1="290" y1="42" x2="320" y2="42" stroke="#1F3864" stroke-width="1.2" marker-end="url(#g1)"/>
  <line x1="385" y1="64" x2="385" y2="90" stroke="#1F3864" stroke-width="1.2" marker-end="url(#g1)"/>
  <!-- the loop box -->
  <rect x="160" y="90" width="450" height="110" rx="4" fill="#F1F4F9" stroke="#2E5496" stroke-width="1.4"/>
  <text x="170" y="105" font-weight="700" fill="#2E5496">run_agent() — the loop (loop.py, ~60 lines), max 12 turns</text>
  <rect x="175" y="115" width="130" height="34" rx="3" fill="#fff" stroke="#1F3864"/>
  <text x="240" y="129" text-anchor="middle" font-weight="700">messages.create()</text>
  <text x="240" y="142" text-anchor="middle">Sonnet 5 · cached system prompt</text>
  <path d="M320,132 L360,110 L400,132 L360,154 Z" fill="#fff" stroke="#1F3864"/>
  <text x="360" y="129" text-anchor="middle">stop_reason</text>
  <text x="360" y="141" text-anchor="middle">= tool_use?</text>
  <rect x="425" y="115" width="80" height="34" rx="3" fill="#fff" stroke="#1F3864"/>
  <text x="465" y="129" text-anchor="middle" font-weight="700">tools.call()</text>
  <text x="465" y="142" text-anchor="middle">→ dict, never raises</text>
  <rect x="525" y="115" width="75" height="34" rx="3" fill="#fff" stroke="#2E7D4F"/>
  <text x="562" y="129" text-anchor="middle" font-weight="700" fill="#2E7D4F">final text</text>
  <text x="562" y="142" text-anchor="middle">2-line summary</text>
  <line x1="305" y1="132" x2="320" y2="132" stroke="#1F3864" stroke-width="1.2" marker-end="url(#g1)"/>
  <line x1="400" y1="132" x2="425" y2="132" stroke="#1F3864" stroke-width="1.2" marker-end="url(#g1)"/><text x="405" y="126" fill="#1F3864">yes</text>
  <path d="M360,154 L360,175 L562,175 L562,149" fill="none" stroke="#1F3864" stroke-width="1.2" marker-end="url(#g1)"/><text x="450" y="185" fill="#1F3864" text-anchor="middle">no → return AgentResult (tokens, cost, trace)</text>
  <path d="M465,149 L465,165 L240,165 L240,149" fill="none" stroke="#1F3864" stroke-width="1.2" marker-end="url(#g1)"/><text x="352" y="163" fill="#1F3864" text-anchor="middle">tool_result appended as user turn</text>
  <!-- tools list -->
  <rect x="630" y="20" width="120" height="204" rx="3" fill="#fff" stroke="#1F3864"/>
  <text x="690" y="34" text-anchor="middle" font-weight="700" fill="#1F3864">7 tools (tools.py)</text>
  <text x="636" y="50" font-weight="700">get_claim</text><text x="636" y="61" fill="#6B7686">everything about one claim</text>
  <text x="636" y="76" font-weight="700">extract_id_fields</text><text x="636" y="87" fill="#6B7686">Haiku vision; costs money</text>
  <text x="636" y="102" font-weight="700">validate_against_roll</text><text x="636" y="113" fill="#6B7686">§5.5 rules → status</text>
  <text x="636" y="128" font-weight="700">generate_form_50114</text><text x="636" y="139" fill="#6B7686">packet PDF + sha256</text>
  <text x="636" y="154" font-weight="700">lookup_tcad_status</text><text x="636" y="165" fill="#C08A2E">stub — "unavailable"</text>
  <text x="636" y="180" font-weight="700">draft_message</text><text x="636" y="191" fill="#6B7686">rejects false "we filed"</text>
  <text x="636" y="206" font-weight="700" fill="#1F3864">set_status</text><text x="636" y="217" fill="#6B7686">whitelisted transitions only</text>
  <line x1="505" y1="122" x2="630" y2="100" stroke="#6B7686" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- store -->
  <rect x="10" y="90" width="130" height="110" rx="3" fill="#fff" stroke="#1F3864"/>
  <text x="75" y="105" text-anchor="middle" font-weight="700" fill="#1F3864">Store (store.py)</text>
  <text x="18" y="121">Protocol with 8 operations:</text>
  <text x="18" y="133">get_claim · get_image ·</text>
  <text x="18" y="145">record_extraction · add_filing ·</text>
  <text x="18" y="157">add_message · set_status ·</text>
  <text x="18" y="169">audit · list_customers</text>
  <text x="18" y="185" font-weight="700">FixtureStore (tests, JSON)</text>
  <text x="18" y="197" font-weight="700">SupabaseStore (service role)</text>
  <line x1="140" y1="145" x2="160" y2="145" stroke="#6B7686" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="315" y="238" text-anchor="middle" fill="#6B7686" font-size="8">Cannot, by construction: send email, charge a card, submit to TCAD, delete anything, set filed/approved/refunded. Adding any of those is a product decision (B-13), not a code change.</text>
  <text x="315" y="252" text-anchor="middle" fill="#6B7686" font-size="8">Typical run: 3–6 turns, ≈ $0.02–0.05 per claim. Trace saved to data/out/agent_run.json and uploaded as an Actions artifact for replay and evals.</text>
</svg>
