<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-size="8.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="pf1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1F3864"/></marker>
    <marker id="pf2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#C08A2E"/></marker>
  </defs>
  <!-- swimlanes -->
  <rect x="0" y="0" width="760" height="70" fill="#F1F4F9"/>
  <text x="8" y="14" font-weight="700" fill="#1F3864" font-size="9">OFFICIAL RECORDS (external — we read, never write)</text>
  <g>
    <rect x="15" y="22" width="165" height="42" rx="3" fill="#fff" stroke="#6B7686"/>
    <text x="97" y="37" text-anchor="middle" font-weight="700" fill="#6B7686">R1 · TCAD roll supplement</text>
    <text x="97" y="49" text-anchor="middle">monthly zip · hs_exempt flag per account</text>
    <text x="97" y="59" text-anchor="middle" fill="#6B7686">authoritative, bulk, ~30-day latency</text>
    <rect x="200" y="22" width="165" height="42" rx="3" fill="#fff" stroke="#6B7686"/>
    <text x="282" y="37" text-anchor="middle" font-weight="700" fill="#6B7686">R2 · TCAD property portal</text>
    <text x="282" y="49" text-anchor="middle">travis.prodigycad.com/property-detail/{id}</text>
    <text x="282" y="59" text-anchor="middle" fill="#6B7686">per-property, days latency, JS app</text>
    <rect x="385" y="22" width="165" height="42" rx="3" fill="#fff" stroke="#6B7686"/>
    <text x="467" y="37" text-anchor="middle" font-weight="700" fill="#6B7686">R3 · Travis County Tax Office</text>
    <text x="467" y="49" text-anchor="middle">travis.go2gov.net account page</text>
    <text x="467" y="59" text-anchor="middle" fill="#6B7686">statements, payments; refund line TBC</text>
    <rect x="570" y="22" width="175" height="42" rx="3" fill="#fff" stroke="#6B7686"/>
    <text x="657" y="37" text-anchor="middle" font-weight="700" fill="#6B7686">R4 · Customer (backstop only)</text>
    <text x="657" y="49" text-anchor="middle">"did your refund check arrive?" reply</text>
    <text x="657" y="59" text-anchor="middle" fill="#6B7686">never the trigger for a charge</text>
  </g>
  <!-- pipeline -->
  <text x="8" y="92" font-weight="700" fill="#1F3864" font-size="9">OUR PIPELINE (GitHub Actions, weekly; every check written to record_checks with evidence)</text>
  <g>
    <rect x="15" y="100" width="130" height="58" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="80" y="115" text-anchor="middle" font-weight="700" fill="#1F3864">S1 · File</text>
    <text x="80" y="128" text-anchor="middle">human emails packet to TCAD</text>
    <text x="80" y="140" text-anchor="middle">ops "Mark filed" → submitted_at,</text>
    <text x="80" y="152" text-anchor="middle">channel; claim → filed</text>

    <rect x="165" y="100" width="150" height="58" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="240" y="115" text-anchor="middle" font-weight="700" fill="#1F3864">S2 · Approval watch</text>
    <text x="240" y="128" text-anchor="middle">R2 weekly for claims in filed;</text>
    <text x="240" y="140" text-anchor="middle">R1 diff monthly as the check.</text>
    <text x="240" y="152" text-anchor="middle">flag flips → approved_at; → approved</text>

    <rect x="335" y="100" width="150" height="58" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="410" y="115" text-anchor="middle" font-weight="700" fill="#1F3864">S3 · Refund watch</text>
    <text x="410" y="128" text-anchor="middle">from approval, expect refund ≤ 60 d</text>
    <text x="410" y="140" text-anchor="middle">(§11.431(b)); R3 weekly per account;</text>
    <text x="410" y="152" text-anchor="middle">refund seen → refunds rows per unit/year</text>

    <rect x="505" y="100" width="120" height="58" rx="3" fill="#fff" stroke="#1F3864"/>
    <text x="565" y="115" text-anchor="middle" font-weight="700" fill="#1F3864">S4 · Notice</text>
    <text x="565" y="128" text-anchor="middle">email: refund observed,</text>
    <text x="565" y="140" text-anchor="middle">fee = 25% × amount, charge</text>
    <text x="565" y="152" text-anchor="middle">in 3 business days; reply to dispute</text>

    <rect x="645" y="100" width="100" height="58" rx="3" fill="#fff" stroke="#2E7D4F" stroke-width="1.4"/>
    <text x="695" y="115" text-anchor="middle" font-weight="700" fill="#2E7D4F">S5 · Charge</text>
    <text x="695" y="128" text-anchor="middle">Stripe PaymentIntent</text>
    <text x="695" y="140" text-anchor="middle">on saved card; receipt;</text>
    <text x="695" y="152" text-anchor="middle">claim → paid</text>
  </g>
  <line x1="145" y1="129" x2="165" y2="129" stroke="#1F3864" stroke-width="1.2" marker-end="url(#pf1)"/>
  <line x1="315" y1="129" x2="335" y2="129" stroke="#1F3864" stroke-width="1.2" marker-end="url(#pf1)"/>
  <line x1="485" y1="129" x2="505" y2="129" stroke="#1F3864" stroke-width="1.2" marker-end="url(#pf1)"/>
  <line x1="625" y1="129" x2="645" y2="129" stroke="#1F3864" stroke-width="1.2" marker-end="url(#pf1)"/>
  <!-- record links -->
  <line x1="97" y1="64" x2="215" y2="100" stroke="#6B7686" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#pf1)"/>
  <line x1="282" y1="64" x2="250" y2="100" stroke="#6B7686" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#pf1)"/>
  <line x1="467" y1="64" x2="420" y2="100" stroke="#6B7686" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#pf1)"/>
  <line x1="657" y1="64" x2="440" y2="100" stroke="#C08A2E" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#pf2)"/>
  <!-- exception lanes -->
  <text x="8" y="186" font-weight="700" fill="#1F3864" font-size="9">EXCEPTIONS</text>
  <g>
    <rect x="15" y="194" width="230" height="46" rx="3" fill="#fff" stroke="#A23B3B"/>
    <text x="22" y="208" font-weight="700" fill="#A23B3B">Denied (R2 shows denial / TCAD letter)</text>
    <text x="22" y="220">denied_at, denial_reason; ~30-day protest window countdown;</text>
    <text x="22" y="232">hand-off packet to attorney of counsel (B-08). No fee.</text>
    <rect x="265" y="194" width="230" height="46" rx="3" fill="#fff" stroke="#C08A2E"/>
    <text x="272" y="208" font-weight="700" fill="#C08A2E">Approved but no refund seen by day 75</text>
    <text x="272" y="220">ask customer (R4); if paid by escrow the refund goes to</text>
    <text x="272" y="232">whoever paid — servicer case; ops task, no auto-charge.</text>
    <rect x="515" y="194" width="230" height="46" rx="3" fill="#fff" stroke="#C08A2E"/>
    <text x="522" y="208" font-weight="700" fill="#C08A2E">Partial refund (one unit refunds, others lag)</text>
    <text x="522" y="220">charge per refunds row as each is observed; fee never</text>
    <text x="522" y="232">exceeds 25% of the sum actually observed.</text>
  </g>
  <!-- principles -->
  <rect x="15" y="256" width="730" height="54" rx="3" fill="#F1F4F9" stroke="#C9D2DF"/>
  <text x="22" y="270" font-weight="700" fill="#1F3864">Customer-first rules encoded in the pipeline</text>
  <text x="22" y="282" font-size="8">1. Charge only after an official record shows the refund — never on approval, never on a promise.  2. The customer sees the evidence (screenshot/extract) in the notice email.</text>
  <text x="22" y="293" font-size="8">3. Three business days' notice before any charge, with one-click dispute that pauses it.  4. Fee = observed amount × 25%, rounded down to the dollar, capped at 1.1 × the signup estimate.</text>
  <text x="22" y="304" font-size="8">5. If we cannot observe a refund we ask — we do not guess; unobserved refunds age into an ops queue, not a charge.</text>
  <text x="8" y="330" fill="#6B7686">Build order (SPEC-05): S1 + R1 diff first (zero scraping risk) → R2 headless check → S3/R3 → S4/S5 with Stripe. Per-check evidence makes every charge defensible under the service agreement.</text>
  <text x="8" y="342" fill="#6B7686">Open: R3 refund line-item visibility and the Prodigy portal's exemption display are unverified until Claude Code inspects them with a headless browser (SPEC-05 task 1).</text>
</svg>
