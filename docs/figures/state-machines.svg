<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-size="8.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="s1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1F3864"/></marker>
    <marker id="s2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#C08A2E"/></marker>
  </defs>
  <!-- Lead lifecycle -->
  <text x="10" y="10" font-size="9.5" font-weight="700" fill="#1F3864">LEAD STATUS (leads.status) — who moves it</text>
  <g>
    <rect x="10" y="30" width="80" height="26" rx="13" fill="#F1F4F9" stroke="#1F3864"/><text x="50" y="47" text-anchor="middle" font-weight="700">new</text>
    <rect x="125" y="30" width="80" height="26" rx="13" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/><text x="165" y="47" text-anchor="middle" font-weight="700" fill="#C08A2E">mailed</text>
    <rect x="240" y="30" width="80" height="26" rx="13" fill="#F1F4F9" stroke="#1F3864"/><text x="280" y="47" text-anchor="middle" font-weight="700">opened</text>
    <rect x="355" y="30" width="80" height="26" rx="13" fill="#F1F4F9" stroke="#1F3864"/><text x="395" y="47" text-anchor="middle" font-weight="700">claimed</text>
    <rect x="470" y="30" width="80" height="26" rx="13" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/><text x="510" y="47" text-anchor="middle" font-weight="700" fill="#C08A2E">filed → approved</text>
    <rect x="585" y="30" width="80" height="26" rx="13" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/><text x="625" y="47" text-anchor="middle" font-weight="700" fill="#C08A2E">refunded → closed</text>
    <rect x="680" y="30" width="70" height="26" rx="13" fill="#fff" stroke="#6B7686"/><text x="715" y="47" text-anchor="middle" font-weight="700" fill="#6B7686">suppressed</text>
  </g>
  <line x1="90" y1="43" x2="125" y2="43" stroke="#C08A2E" stroke-width="1.3" marker-end="url(#s2)"/>
  <line x1="205" y1="43" x2="240" y2="43" stroke="#1F3864" stroke-width="1.3" marker-end="url(#s1)"/>
  <line x1="320" y1="43" x2="355" y2="43" stroke="#1F3864" stroke-width="1.3" marker-end="url(#s1)"/>
  <line x1="435" y1="43" x2="470" y2="43" stroke="#C08A2E" stroke-width="1.3" marker-end="url(#s2)"/>
  <line x1="550" y1="43" x2="585" y2="43" stroke="#C08A2E" stroke-width="1.3" marker-end="url(#s2)"/>
  <path d="M50,30 C120,12 220,12 280,30" fill="none" stroke="#1F3864" stroke-width="1" marker-end="url(#s1)"/>
  
  <g fill="#6B7686">
    <text x="50" y="70" text-anchor="middle">publisher</text>
    <text x="380" y="82" text-anchor="middle" font-size="7.5">The arc new → opened is the claim-page GET; "mailed" is skipped until the Lob batch writes it (G-7).</text>
    <text x="165" y="70" text-anchor="middle">Lob send (gap)</text>
    <text x="280" y="70" text-anchor="middle">claim API GET</text>
    <text x="395" y="70" text-anchor="middle">claim API POST</text>
    <text x="510" y="70" text-anchor="middle">nothing writes these yet</text>
    <text x="625" y="70" text-anchor="middle">nothing writes these yet</text>
    <text x="715" y="70" text-anchor="middle">manual</text>
  </g>

  <!-- Claim lifecycle -->
  <text x="10" y="92" font-size="9.5" font-weight="700" fill="#1F3864">CLAIM STATUS (claims.status) — allowed transitions; the agent may set only the five in blue</text>
  <g>
    <rect x="10" y="150" width="88" height="26" rx="13" fill="#F1F4F9" stroke="#1F3864"/><text x="54" y="167" text-anchor="middle" font-weight="700">submitted</text>
    <rect x="130" y="150" width="88" height="26" rx="13" fill="#E3E8F0" stroke="#2E5496"/><text x="174" y="167" text-anchor="middle" font-weight="700" fill="#2E5496">processing</text>
    <rect x="270" y="110" width="98" height="26" rx="13" fill="#E3E8F0" stroke="#2E5496"/><text x="319" y="127" text-anchor="middle" font-weight="700" fill="#2E5496">ready_to_submit</text>
    <rect x="270" y="150" width="98" height="26" rx="13" fill="#E3E8F0" stroke="#2E5496"/><text x="319" y="167" text-anchor="middle" font-weight="700" fill="#2E5496">needs_dl_update</text>
    <rect x="270" y="190" width="98" height="26" rx="13" fill="#E3E8F0" stroke="#2E5496"/><text x="319" y="207" text-anchor="middle" font-weight="700" fill="#2E5496">needs_review</text>
    <rect x="270" y="240" width="98" height="26" rx="13" fill="#E3E8F0" stroke="#2E5496"/><text x="319" y="257" text-anchor="middle" font-weight="700" fill="#2E5496">withdrawn</text>
    <rect x="420" y="110" width="70" height="26" rx="13" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/><text x="455" y="127" text-anchor="middle" font-weight="700" fill="#C08A2E">filed</text>
    <rect x="530" y="98" width="70" height="26" rx="13" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/><text x="565" y="115" text-anchor="middle" font-weight="700" fill="#C08A2E">approved</text>
    <rect x="530" y="140" width="70" height="26" rx="13" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/><text x="565" y="157" text-anchor="middle" font-weight="700" fill="#C08A2E">denied</text>
    <rect x="620" y="98" width="60" height="26" rx="13" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/><text x="650" y="115" text-anchor="middle" font-weight="700" fill="#C08A2E">refunded</text>
    <rect x="700" y="98" width="50" height="26" rx="13" fill="#fff" stroke="#C08A2E" stroke-dasharray="4 3"/><text x="725" y="115" text-anchor="middle" font-weight="700" fill="#C08A2E">paid</text>
  </g>
  <!-- transitions -->
  <line x1="98" y1="163" x2="130" y2="163" stroke="#1F3864" stroke-width="1.3" marker-end="url(#s1)"/>
  <path d="M54,150 C60,120 150,95 270,120" fill="none" stroke="#6B7686" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M54,176 C70,215 180,220 270,205" fill="none" stroke="#1F3864" stroke-width="1" marker-end="url(#s1)"/>
  <text x="120" y="222" fill="#1F3864">claim POST: not primary / other homestead</text>
  <line x1="218" y1="158" x2="270" y2="126" stroke="#1F3864" stroke-width="1.3" marker-end="url(#s1)"/>
  <line x1="218" y1="163" x2="270" y2="163" stroke="#1F3864" stroke-width="1.3" marker-end="url(#s1)"/>
  <line x1="218" y1="168" x2="270" y2="200" stroke="#1F3864" stroke-width="1.3" marker-end="url(#s1)"/>
  <text x="235" y="145" fill="#1F3864" font-size="7.5">validator</text>
  <!-- dl_update / review loops -->
  <path d="M368,160 C395,150 395,130 368,125" fill="none" stroke="#1F3864" stroke-width="1" marker-end="url(#s1)"/>
  <text x="392" y="145" fill="#1F3864" font-size="7.5">re-upload</text>
  <path d="M368,200 C405,195 405,140 380,130" fill="none" stroke="#1F3864" stroke-width="1" marker-end="url(#s1)"/>
  <path d="M319,176 L319,190" stroke="#1F3864" stroke-width="1" marker-end="url(#s1)"/>
  <path d="M340,216 L340,240" stroke="#1F3864" stroke-width="1" marker-end="url(#s1)"/>
  <path d="M300,176 C280,200 280,230 300,240" fill="none" stroke="#1F3864" stroke-width="1" marker-end="url(#s1)"/>
  <!-- forward -->
  <line x1="368" y1="123" x2="420" y2="123" stroke="#C08A2E" stroke-width="1.3" marker-end="url(#s2)"/>
  <text x="394" y="118" text-anchor="middle" fill="#C08A2E" font-size="7.5">human files</text>
  <line x1="490" y1="118" x2="530" y2="112" stroke="#C08A2E" stroke-width="1.3" marker-end="url(#s2)"/>
  <line x1="490" y1="128" x2="530" y2="150" stroke="#C08A2E" stroke-width="1.3" marker-end="url(#s2)"/>
  <line x1="600" y1="111" x2="620" y2="111" stroke="#C08A2E" stroke-width="1.3" marker-end="url(#s2)"/>
  <line x1="680" y1="111" x2="700" y2="111" stroke="#C08A2E" stroke-width="1.3" marker-end="url(#s2)"/>
  <path d="M455,136 C455,200 380,215 368,210" fill="none" stroke="#6B7686" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#s1)"/>
  <path d="M565,166 C560,230 400,240 368,212" fill="none" stroke="#6B7686" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#s1)"/>
  <text x="470" y="235" fill="#6B7686" font-size="7.5">filed/denied → needs_review (human)</text>
  <!-- legend -->
  <text x="10" y="300" font-weight="700" fill="#1F3864">Reading the claim states</text>
  <text x="10" y="314">submitted — form saved, extraction not yet run · processing — module 9 or the agent is working on it · ready_to_submit — packet built, validation clean, waiting for the customer's "go" and a human to file</text>
  <text x="10" y="327">needs_dl_update — license address ≠ property; customer changes it at DPS and re-uploads (SPEC-02 / G-30) · needs_review — a human must look (name mismatch, low confidence, not Texas ID, ineligibility answer, processing error)</text>
  <text x="10" y="340">withdrawn — customer or operator stopped the claim · filed → approved/denied → refunded → paid are the post-filing states: designed in §5.7 (SPEC-05), no code yet (amber, dashed)</text>
  <text x="10" y="353" fill="#6B7686">Blue = states the agent's set_status tool may target. Dashed grey = transitions a human makes in the database today because no UI exists.</text>
</svg>
