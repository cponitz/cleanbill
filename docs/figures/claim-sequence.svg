<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-size="8.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="q1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1F3864"/></marker>
  <marker id="q2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#6B7686"/></marker></defs>
  <!-- lifelines -->
  <g font-weight="700" fill="#1F3864" text-anchor="middle">
    <text x="60" y="16">Homeowner</text><text x="180" y="16">claim.html</text><text x="310" y="16">claim API (8)</text><text x="440" y="16">Postgres + buckets</text><text x="570" y="16">process-claim (9)</text><text x="690" y="16">Anthropic</text>
  </g>
  <g stroke="#C9D2DF" stroke-width="1">
    <line x1="60" y1="22" x2="60" y2="400"/><line x1="180" y1="22" x2="180" y2="400"/><line x1="310" y1="22" x2="310" y2="400"/><line x1="440" y1="22" x2="440" y2="400"/><line x1="570" y1="22" x2="570" y2="400"/><line x1="690" y1="22" x2="690" y2="400"/>
  </g>
  <!-- steps -->
  <g stroke="#1F3864" stroke-width="1.2">
    <line x1="60" y1="40" x2="178" y2="40" marker-end="url(#q1)"/>
    <line x1="180" y1="58" x2="308" y2="58" marker-end="url(#q1)"/>
    <line x1="310" y1="76" x2="438" y2="76" marker-end="url(#q1)"/>
    <line x1="438" y1="94" x2="312" y2="94" marker-end="url(#q1)"/>
    <line x1="308" y1="112" x2="182" y2="112" marker-end="url(#q1)"/>
    <line x1="178" y1="130" x2="62" y2="130" marker-end="url(#q1)"/>
    <line x1="60" y1="160" x2="178" y2="160" marker-end="url(#q1)"/>
    <line x1="180" y1="178" x2="308" y2="178" marker-end="url(#q1)"/>
    <line x1="310" y1="214" x2="438" y2="214" marker-end="url(#q1)"/>
    <line x1="310" y1="232" x2="438" y2="232" marker-end="url(#q1)"/>
    <line x1="310" y1="250" x2="568" y2="250" marker-end="url(#q1)" stroke-dasharray="4 3"/>
    <line x1="308" y1="268" x2="182" y2="268" marker-end="url(#q1)"/>
    <line x1="178" y1="286" x2="62" y2="286" marker-end="url(#q1)"/>
    <line x1="570" y1="310" x2="442" y2="310" marker-end="url(#q1)"/>
    <line x1="570" y1="328" x2="688" y2="328" marker-end="url(#q1)"/>
    <line x1="688" y1="346" x2="572" y2="346" marker-end="url(#q1)"/>
    <line x1="570" y1="382" x2="442" y2="382" marker-end="url(#q1)"/>
  </g>
  <g fill="#1F2733">
    <text x="118" y="36" text-anchor="middle">1 scans QR / types code</text>
    <text x="245" y="54" text-anchor="middle">2 GET /claim?c=TRD-…</text>
    <text x="375" y="72" text-anchor="middle">3 rate-limit check; load lead+property</text>
    <text x="375" y="90" text-anchor="middle">4 insert events(view); lead → opened</text>
    <text x="245" y="108" text-anchor="middle">5 JSON: estimate, situs, years, deadline</text>
    <text x="118" y="126" text-anchor="middle">6 sees refund, fee, "file free" line</text>
    <text x="118" y="156" text-anchor="middle">7 answers 5 questions, photographs license, 3 consents, types name</text>
    <text x="245" y="174" text-anchor="middle">8 POST multipart (form + images)</text>
    <text x="310" y="198" text-anchor="middle" fill="#6B7686">9 validate: required fields, email, consents, file type/size, signature == full_name; ineligibility answers → needs_review</text>
    <text x="375" y="210" text-anchor="middle">10 insert customers (ESIGN record)</text>
    <text x="375" y="228" text-anchor="middle">11 upload ids/; insert documents; lead → claimed; events + audit</text>
    <text x="440" y="246" text-anchor="middle">12 kick POST process-claim {customer_id} (service role, async via waitUntil)</text>
    <text x="245" y="264" text-anchor="middle">13 JSON {ok, first_name}</text>
    <text x="118" y="282" text-anchor="middle">14 "Thanks, Richard" state</text>
    <text x="506" y="306" text-anchor="middle">15 customers → processing; download images</text>
    <text x="629" y="324" text-anchor="middle">16 Haiku 4.5 + forced schema</text>
    <text x="629" y="342" text-anchor="middle">17 13 fields + confidence</text>
    <text x="570" y="366" text-anchor="middle" fill="#6B7686">18 validate() → status; fill Form 50-114 (pdf-lib), sign /s/, flatten, audit page; sha256</text>
    <text x="506" y="378" text-anchor="middle">19 update documents; upload packets/; insert filings; customers.status; insert messages draft; audit</text>
  </g>
  <text x="380" y="408" text-anchor="middle" fill="#6B7686">Elapsed: steps 2–5 &lt; 1 s · steps 8–14 ≈ 2 s · steps 15–19 ≈ 6–10 s. The homeowner never waits for extraction. Errors in 15–19 set needs_review with "processing error: …".</text>
</svg>
