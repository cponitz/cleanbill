name: claims-agent (shadow mode)
# Runs the claims agent over open claims. Drafts only; a human approves in /ops.
# Schedule is disabled until there is test data (ADR 0011): run it from the Actions tab ("Run workflow").
# To re-enable: add under `on:`  schedule: [{cron: "*/30 * * * *"}]
on:
  workflow_dispatch:
    inputs:
      claim:
        description: "Run for one claim id (optional)"
        required: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dev]
      - run: python -m pytest -q
      - name: run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.claim }}" ]; then
            python -m trd.agent.run --store supabase --claim "${{ github.event.inputs.claim }}"
          else
            python -m trd.agent.run --store supabase --statuses submitted,needs_dl_update,needs_review
          fi
      - name: purge ID images no longer needed (Tax Code §11.48 retention policy)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m trd.jobs.purge_ids --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: agent-trace, path: data/out/agent_run.json, if-no-files-found: ignore }
