name: claims-agent (shadow mode)
# Runs the claims agent over open claims. Drafts only; a human approves in /ops.
# Schedule is disabled until there is test data (ADR 0011): run it from the Actions tab ("Run workflow").
# To re-enable: add under `on:`  schedule: [{cron: "*/30 * * * *"}]
on:
  workflow_dispatch:
    inputs:
      claim:
        description: "Run for one claim id (optional)"
        required: false
env:
  OPS_PASSWORD: ${{ secrets.OPS_PASSWORD }}
  PROJECT_REF: letrfpwskjbgnyacesgv
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dev]
      - run: python -m pytest -q
      - name: run agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.claim }}" ]; then
            python -m cleanbill.agent.run --store supabase --claim "${{ github.event.inputs.claim }}"
          else
            python -m cleanbill.agent.run --store supabase --statuses submitted,needs_dl_update,needs_review
          fi
      - name: purge ID images no longer needed (Tax Code §11.48 retention policy)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m cleanbill.jobs.purge_ids --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: agent-trace, path: data/out/agent_run.json, if-no-files-found: ignore }
      - name: record this run for /ops (system_status, SPEC-09)
        if: always() && env.OPS_PASSWORD != ''
        run: |
          VALUE=$(jq -nc --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg result "${{ job.status }}" --arg agent "${{ steps.agent.outcome }}" --argjson processed "$(jq -c '(.results | length)' data/out/agent_run.json 2>/dev/null || echo null)" --argjson cost "$(jq -c '.total_cost_usd' data/out/agent_run.json 2>/dev/null || echo null)" \
            '{commit: $sha, run_id: $run, url: $url, result: $result, at: (now | todate), agent: $agent, claims_processed: $processed, cost_usd: $cost}')
          curl -sf -m 30 -X POST "https://$PROJECT_REF.supabase.co/functions/v1/ops" -H "x-ops-key: $OPS_PASSWORD" -H "content-type: application/json" \
            -d "$(jq -nc --arg key "agent_run" --argjson value "$VALUE" '{action: "system_status", key: $key, value: $value}')" > /dev/null \
            || echo "::warning::could not record agent_run status in system_status"
